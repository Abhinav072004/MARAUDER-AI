name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
        env:
          SDL_AUDIODRIVER: dummy
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libportaudio2 libxcb-cursor0
      - run: python -m pip install -r requirements-gui.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
          MPLCONFIGDIR: /tmp/marauder-mpl
